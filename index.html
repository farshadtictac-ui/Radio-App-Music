<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>آهنگ‌های هفته</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0a0c13;
    --bg-1:#141826;
    --amber:#f2a65a;
    --pink:#ff6f9c;
    --teal:#3bd6c6;
    --violet:#9b7bff;
    --text:#eef1f6;
    --text-dim:#8b93a5;
    --line:rgba(255,255,255,.07);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;
    background:var(--bg-0);
    color:var(--text);
    font-family:'Space Grotesk',system-ui,sans-serif;
    overflow-x:hidden;
  }
  body{ min-height:100vh; min-height:100dvh; padding-bottom:24px; position:relative; }

  /* ---------------- پس‌زمینه‌ی رنگی متحرک (Aurora) ---------------- */
  .aurora{
    position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
  }
  .aurora span{
    position:absolute; border-radius:50%;
    filter:blur(60px); opacity:.35;
    will-change:transform;
  }
  .aurora span:nth-child(1){
    width:260px;height:260px; background:var(--amber);
    top:-60px; right:-40px;
    animation:float1 16s ease-in-out infinite alternate;
  }
  .aurora span:nth-child(2){
    width:220px;height:220px; background:var(--pink);
    bottom:120px; left:-60px;
    animation:float2 20s ease-in-out infinite alternate;
  }
  .aurora span:nth-child(3){
    width:200px;height:200px; background:var(--teal);
    bottom:-60px; right:20%;
    animation:float3 18s ease-in-out infinite alternate;
  }
  .aurora span:nth-child(4){
    width:180px;height:180px; background:var(--violet);
    top:30%; left:10%;
    animation:float1 22s ease-in-out infinite alternate-reverse;
  }
  @keyframes float1{ from{ transform:translate(0,0); } to{ transform:translate(30px,50px); } }
  @keyframes float2{ from{ transform:translate(0,0); } to{ transform:translate(40px,-30px); } }
  @keyframes float3{ from{ transform:translate(0,0); } to{ transform:translate(-30px,-40px); } }

  /* ---------------- صفحه‌ی ورود (Splash) ---------------- */
  #splash{
    position:fixed; inset:0; z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
    background:radial-gradient(circle at 50% 20%, #1b2032, var(--bg-0) 75%);
    transition:opacity .5s ease, visibility .5s ease;
  }
  #splash.hide{ opacity:0; visibility:hidden; pointer-events:none; }
  .orb{
    width:104px; height:104px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:42px;
    background:conic-gradient(from 0deg, var(--amber), var(--pink), var(--violet), var(--teal), var(--amber));
    animation:spin-slow 6s linear infinite;
    box-shadow:0 0 40px rgba(242,166,90,.35);
    margin-bottom:22px;
  }
  .orb::after{
    content:"🎧"; display:block;
    width:88px; height:88px; border-radius:50%;
    background:var(--bg-0);
    display:flex; align-items:center; justify-content:center;
    margin:8px;
  }
  @keyframes spin-slow{ to{ transform:rotate(360deg); } }
  #splash h1{
    margin:0 0 8px; font-size:26px; font-weight:700;
    background:linear-gradient(90deg, var(--amber), var(--pink), var(--teal));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #splash p{ margin:0 0 26px; color:var(--text-dim); font-size:14px; max-width:280px; line-height:1.9; }
  #enterBtn{
    font-family:inherit; font-size:15px; font-weight:700;
    color:#141826; border:none; border-radius:30px;
    padding:14px 40px;
    background:linear-gradient(90deg, var(--amber), var(--pink));
    box-shadow:0 8px 24px rgba(242,166,90,.3);
    cursor:pointer;
    animation:pulse-btn 2.2s ease-in-out infinite;
  }
  #enterBtn:active{ transform:scale(.96); }
  @keyframes pulse-btn{
    0%,100%{ box-shadow:0 8px 24px rgba(242,166,90,.3); }
    50%{ box-shadow:0 8px 34px rgba(255,111,156,.45); }
  }
  .splash-bars{ display:flex; gap:4px; margin-top:28px; height:22px; align-items:flex-end; }
  .splash-bars span{
    width:5px; border-radius:2px;
    animation:mini-eq 1.1s ease-in-out infinite;
  }
  .splash-bars span:nth-child(1){ background:var(--amber); animation-delay:0s; }
  .splash-bars span:nth-child(2){ background:var(--pink); animation-delay:.15s; }
  .splash-bars span:nth-child(3){ background:var(--violet); animation-delay:.3s; }
  .splash-bars span:nth-child(4){ background:var(--teal); animation-delay:.45s; }
  .splash-bars span:nth-child(5){ background:var(--amber); animation-delay:.6s; }

  /* ---------------- سربرگ و پیام خوش‌آمد ---------------- */
  header{
    position:relative; z-index:1;
    padding:22px 20px 4px;
    text-align:center;
  }
  header .eyebrow{
    font-family:'Space Mono',monospace;
    font-size:11px;letter-spacing:.3em;
    color:var(--amber);text-transform:uppercase;
  }
  header h1{
    margin:6px 0 4px; font-size:22px; font-weight:700;
    background:linear-gradient(90deg, var(--amber), var(--pink), var(--teal));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  header .greeting{ font-size:12.5px; color:var(--text-dim); }

  /* ---------------- جستجو ---------------- */
  .search-wrap{ position:relative; z-index:1; margin:14px 16px 10px; }
  #searchInput{
    width:100%; font-family:inherit; font-size:13.5px;
    background:rgba(255,255,255,.04);
    border:1px solid var(--line); border-radius:14px;
    color:var(--text); padding:11px 14px;
    outline:none;
  }
  #searchInput::placeholder{ color:var(--text-dim); }
  #searchInput:focus{ border-color:rgba(242,166,90,.5); }

  /* ---------------- نوار پخش‌کننده‌ی مینی ---------------- */
  .mini-player{
    position:sticky; top:0; z-index:4;
    margin:0 16px 10px;
    background:linear-gradient(180deg,#181f30,#10141d);
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px 16px 10px;
    box-shadow:0 10px 24px rgba(0,0,0,.35);
  }
  .mini-top{
    display:flex; align-items:center; gap:12px;
  }
  #playPauseBtn{
    flex:0 0 auto;
    width:46px;height:46px;border-radius:50%;
    border:none;
    background:linear-gradient(135deg, var(--amber), var(--pink));
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(242,166,90,.35);
  }
  #playPauseBtn svg{ width:18px;height:18px; }
  #playPauseBtn svg path,#playPauseBtn svg rect{ fill:#161b26; }
  #shuffleBtn{
    flex:0 0 auto;
    width:36px;height:36px;border-radius:50%;
    border:1px solid var(--line);
    background:rgba(255,255,255,.03);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer; font-size:15px;
    transition:border-color .2s, background .2s;
  }
  #shuffleBtn.on{
    border-color:var(--teal);
    background:rgba(59,214,198,.12);
  }
  .mini-info{ flex:1 1 auto; min-width:0; }
  .mini-info .t{
    font-family:'Space Mono',monospace; font-size:13.5px; color:var(--amber);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .mini-info .a{
    font-size:11.5px; color:var(--text-dim); margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .mini-viz{
    flex:0 0 auto; width:34px; height:22px;
    display:flex; align-items:flex-end; justify-content:center; gap:3px;
  }
  .mini-viz span{
    width:4px; height:4px; border-radius:1px;
    background:rgba(255,255,255,.15);
    transition:background .3s;
  }
  .mini-viz.active span:nth-child(1){ background:var(--amber); animation:mini-eq 1.1s ease-in-out infinite; animation-delay:0s; }
  .mini-viz.active span:nth-child(2){ background:var(--pink); animation:mini-eq 1.1s ease-in-out infinite; animation-delay:.15s; }
  .mini-viz.active span:nth-child(3){ background:var(--violet); animation:mini-eq 1.1s ease-in-out infinite; animation-delay:.3s; }
  .mini-viz.active span:nth-child(4){ background:var(--teal); animation:mini-eq 1.1s ease-in-out infinite; animation-delay:.45s; }
  @keyframes mini-eq{
    0%,100%{ height:4px; }
    50%{ height:20px; }
  }

  /* ---- نوار پیشرفت آهنگ ---- */
  .seek-row{
    display:flex; align-items:center; gap:8px;
    margin-top:8px;
  }
  .seek-row .time{
    font-family:'Space Mono',monospace; font-size:10.5px; color:var(--text-dim);
    flex:0 0 auto; min-width:32px; text-align:center;
  }
  #seekBar{
    flex:1 1 auto; -webkit-appearance:none; appearance:none;
    height:4px; border-radius:2px;
    background:linear-gradient(90deg, var(--amber) 0%, var(--amber) 0%, rgba(255,255,255,.12) 0%);
    outline:none; cursor:pointer;
  }
  #seekBar:disabled{ cursor:default; opacity:.5; }
  #seekBar::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:13px; height:13px; border-radius:50%;
    background:linear-gradient(135deg, var(--amber), var(--pink));
    box-shadow:0 0 6px rgba(242,166,90,.6);
    border:none;
  }
  #seekBar::-moz-range-thumb{
    width:13px; height:13px; border-radius:50%;
    background:linear-gradient(135deg, var(--amber), var(--pink));
    box-shadow:0 0 6px rgba(242,166,90,.6);
    border:none;
  }
  #seekBar::-moz-range-track{
    height:4px; border-radius:2px; background:rgba(255,255,255,.12);
  }

  /* ---------------- لیست آهنگ‌ها ---------------- */
  .list-wrap{ position:relative; z-index:1; padding:4px 16px; }
  .state-msg{
    text-align:center; color:var(--text-dim);
    font-size:13px; padding:30px 10px;
  }
  ul#songList{ list-style:none; margin:0; padding:0; }
  .song-row{
    display:flex; align-items:center; gap:12px;
    padding:11px 10px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    border-radius:12px;
    transition:background .2s;
  }
  .song-row:active{ background:rgba(255,255,255,.05); }
  .song-row.active{ background:linear-gradient(90deg, rgba(242,166,90,.14), rgba(255,111,156,.08)); }
  .avatar{
    flex:0 0 38px; width:38px; height:38px; border-radius:11px;
    display:flex; align-items:center; justify-content:center;
    font-size:17px;
    background:linear-gradient(135deg, rgba(242,166,90,.18), rgba(155,123,255,.18));
  }
  .eq{
    flex:0 0 26px; height:16px;
    display:none; align-items:flex-end; gap:2px;
  }
  .song-row.active .eq{ display:flex; }
  .eq span{ width:3px; border-radius:1px; animation:eq 1s ease-in-out infinite; }
  .eq span:nth-child(1){ height:6px; background:var(--amber); animation-delay:0s; }
  .eq span:nth-child(2){ height:14px; background:var(--pink); animation-delay:.2s; }
  .eq span:nth-child(3){ height:9px; background:var(--teal); animation-delay:.4s; }
  @keyframes eq{
    0%,100%{ transform:scaleY(.4); }
    50%{ transform:scaleY(1); }
  }
  .song-meta{ flex:1 1 auto; min-width:0; }
  .song-meta .title{
    font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .song-row.active .song-meta .title{ color:var(--amber); }
  .song-meta .artist{
    font-size:12px; color:var(--text-dim); margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .dl-btn{
    flex:0 0 32px; width:32px; height:32px; border-radius:9px;
    border:1px solid var(--line); background:rgba(255,255,255,.03);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .dl-btn svg{
    width:15px; height:15px;
    fill:none; stroke:var(--text-dim); stroke-width:2;
    stroke-linecap:round; stroke-linejoin:round;
  }
  .dl-btn:active{ background:rgba(242,166,90,.12); border-color:rgba(242,166,90,.4); }
  .dl-btn:active svg{ stroke:var(--amber); }
  .dl-btn.loading{ animation:dl-pulse 1s ease-in-out infinite; pointer-events:none; }
  @keyframes dl-pulse{
    0%,100%{ opacity:1; } 50%{ opacity:.35; }
  }
  .retry-btn{
    display:block; margin:14px auto 0;
    background:none; border:1px solid var(--amber);
    color:var(--amber); border-radius:20px;
    padding:8px 20px; font-family:inherit; font-size:13px;
    cursor:pointer;
  }
  .count-tag{
    font-family:'Space Mono',monospace; font-size:11px; color:var(--text-dim);
    text-align:center; margin:2px 0 10px;
  }
  @media (prefers-reduced-motion: reduce){
    .aurora span, .orb, #enterBtn, .splash-bars span, .mini-viz span, .eq span{ animation:none !important; }
  }
</style>
</head>
<body>

<div class="aurora"><span></span><span></span><span></span><span></span></div>

<!-- ---------------- صفحه‌ی ورود ---------------- -->
<div id="splash">
  <div class="orb"></div>
  <h1>آهنگ‌های هفته</h1>
  <p>یک پلی‌لیست تازه، هر هفته، همیشه در دسترس. یکی رو انتخاب کن و لذت ببر 🎶</p>
  <button id="enterBtn">ورود به رادیو</button>
  <div class="splash-bars"><span></span><span></span><span></span><span></span><span></span></div>
</div>

<!-- ---------------- برنامه‌ی اصلی ---------------- -->
<header>
  <div class="eyebrow">پلی‌لیست هفتگی</div>
  <h1>آهنگ‌های هفته</h1>
  <div class="greeting" id="greeting"></div>
</header>

<div class="search-wrap">
  <input id="searchInput" type="text" placeholder="جستجوی آهنگ یا خواننده…" />
</div>

<div class="mini-player">
  <div class="mini-top">
    <button id="playPauseBtn" aria-label="پخش">
      <svg id="miniPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="miniPause" viewBox="0 0 24 24" hidden><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>
    </button>
    <button id="shuffleBtn" aria-label="پخش تصادفی" title="پخش تصادفی">🔀</button>
    <div class="mini-info">
      <div class="t" id="miniTitle">آهنگی انتخاب نشده</div>
      <div class="a" id="miniArtist">از لیست پایین یک آهنگ انتخاب کنید</div>
    </div>
    <span class="mini-viz" id="miniViz"><span></span><span></span><span></span><span></span></span>
  </div>
  <div class="seek-row">
    <span class="time" id="curTime">۰:۰۰</span>
    <input type="range" id="seekBar" min="0" max="0" step="0.1" value="0" disabled>
    <span class="time" id="durTime">۰:۰۰</span>
  </div>
</div>

<div class="list-wrap">
  <div class="count-tag" id="countTag"></div>
  <div class="state-msg" id="stateMsg">در حال بارگذاری لیست آهنگ‌ها…</div>
  <ul id="songList"></ul>
</div>

<script>
/* =====================================================================
   تنظیمات یک‌بارِ مخزن گیت‌هاب
   ===================================================================== */
const GITHUB_OWNER  = "farshadtictac-ui";
const GITHUB_REPO   = "Radio-App-Music";
const GITHUB_BRANCH = "main";
const SONGS_PATH    = "songs";
/* قالب نام‌گذاری فایل‌ها: "خواننده - نام آهنگ.mp3"  مثال: سوگند - بارون.mp3 */

const AVATAR_EMOJIS = ["🎵","🎶","🎧","🎤","🎸","🥁","🎹","🎺","🎷","🪕"];

let playlist = [];
let currentIndex = -1;
let isPlaying = false;
let shuffle = false;

const audio = new Audio();
audio.preload = "auto";

const stateMsg = document.getElementById('stateMsg');
const countTag = document.getElementById('countTag');
const songListEl = document.getElementById('songList');
const playPauseBtn = document.getElementById('playPauseBtn');
const shuffleBtn = document.getElementById('shuffleBtn');
const miniPlay = document.getElementById('miniPlay');
const miniPause = document.getElementById('miniPause');
const miniTitle = document.getElementById('miniTitle');
const miniArtist = document.getElementById('miniArtist');
const miniViz = document.getElementById('miniViz');
const searchInput = document.getElementById('searchInput');
const greeting = document.getElementById('greeting');
const splash = document.getElementById('splash');
const enterBtn = document.getElementById('enterBtn');
const seekBar = document.getElementById('seekBar');
const curTimeEl = document.getElementById('curTime');
const durTimeEl = document.getElementById('durTime');
let isSeeking = false;

function formatTime(sec){
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}

function paintSeekBar(percent){
  seekBar.style.background =
    `linear-gradient(90deg, var(--amber) ${percent}%, var(--pink) ${percent}%, rgba(255,255,255,.12) ${percent}%)`;
}

audio.addEventListener('loadedmetadata', () => {
  seekBar.max = audio.duration || 0;
  seekBar.disabled = false;
  durTimeEl.textContent = formatTime(audio.duration);
});

audio.addEventListener('timeupdate', () => {
  if (isSeeking) return;
  seekBar.value = audio.currentTime;
  curTimeEl.textContent = formatTime(audio.currentTime);
  const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
  paintSeekBar(pct);
});

seekBar.addEventListener('input', () => {
  isSeeking = true;
  curTimeEl.textContent = formatTime(seekBar.value);
  const pct = seekBar.max ? (seekBar.value / seekBar.max) * 100 : 0;
  paintSeekBar(pct);
});

['change','mouseup','touchend'].forEach(evt => {
  seekBar.addEventListener(evt, () => {
    if (!isSeeking) return;
    audio.currentTime = seekBar.value;
    isSeeking = false;
  });
});

/* ---- صفحه‌ی ورود ---- */
enterBtn.addEventListener('click', () => {
  splash.classList.add('hide');
});

/* ---- پیام خوش‌آمد بر اساس ساعت روز ---- */
(function setGreeting(){
  const h = new Date().getHours();
  let msg = h < 5 ? "پخش شبانه، آروم بمون 🌙"
    : h < 12 ? "صبح بخیر، روزت پرانرژی ☀️"
    : h < 18 ? "عصر بخیر، وقت یه آهنگ خوبه 🌤"
    : "شب بخیر، بشین و گوش بده 🌌";
  greeting.textContent = msg;
})();

function parseFileName(name){
  const noExt = name.replace(/\.mp3$/i, '');
  const withoutOrder = noExt.replace(/^\d+\s*-\s*/, '');
  const parts = withoutOrder.split(/\s-\s/);
  if (parts.length >= 2){
    return { artist: parts[0].trim(), title: parts.slice(1).join(' - ').trim() };
  }
  return { artist: "", title: withoutOrder.trim() };
}

async function fetchPlaylist(){
  const api = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${SONGS_PATH}?ref=${GITHUB_BRANCH}`;
  const res = await fetch(api, { headers: { "Accept": "application/vnd.github+json" } });
  if (!res.ok) throw new Error("github api error " + res.status);
  const data = await res.json();
  const files = data.filter(f => f.type === 'file' && /\.mp3$/i.test(f.name));
  files.sort((a,b) => a.name.localeCompare(b.name, 'fa'));
  return files.map((f, i) => {
    const { artist, title } = parseFileName(f.name);
    return { title, artist, url: f.download_url, emoji: AVATAR_EMOJIS[i % AVATAR_EMOJIS.length] };
  });
}

function renderList(){
  songListEl.innerHTML = "";
  playlist.forEach((song, i) => {
    const li = document.createElement('li');
    li.className = 'song-row';
    li.dataset.index = i;
    li.dataset.search = (song.title + ' ' + song.artist).toLowerCase();
    li.innerHTML = `
      <span class="avatar">${song.emoji}</span>
      <span class="eq"><span></span><span></span><span></span></span>
      <span class="song-meta">
        <div class="title">${song.title || 'بدون عنوان'}</div>
        <div class="artist">${song.artist || ''}</div>
      </span>
      <button class="dl-btn" data-index="${i}" aria-label="دانلود" title="دانلود">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.5m0 0l-4-4m4 4l4-4M5 19h14"/></svg>
      </button>
    `;
    li.addEventListener('click', () => playIndex(i));
    songListEl.appendChild(li);
  });
  countTag.textContent = `🎵 ${playlist.length} آهنگ`;

  document.querySelectorAll('.dl-btn').forEach(btn => {
    btn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const idx = Number(btn.dataset.index);
      downloadTrack(playlist[idx], btn);
    });
  });
}

async function downloadTrack(song, btn){
  const original = btn.innerHTML;
  btn.classList.add('loading');
  try{
    const res = await fetch(song.url);
    if (!res.ok) throw new Error('bad response');
    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const fileName = ((song.artist ? song.artist + ' - ' : '') + (song.title || 'track')).trim() + '.mp3';
    a.href = blobUrl;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(blobUrl), 4000);
  }catch(e){
    miniArtist.textContent = "دانلود با خطا مواجه شد";
  }finally{
    btn.classList.remove('loading');
    btn.innerHTML = original;
  }
}

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  document.querySelectorAll('.song-row').forEach(row => {
    row.style.display = row.dataset.search.includes(q) ? '' : 'none';
  });
});

function highlightActiveRow(){
  document.querySelectorAll('.song-row').forEach(row => {
    row.classList.toggle('active', Number(row.dataset.index) === currentIndex);
  });
}

function updateMiniPlayer(){
  const song = playlist[currentIndex];
  miniTitle.textContent = song ? (song.title || 'بدون عنوان') : 'آهنگی انتخاب نشده';
  miniArtist.textContent = song ? (song.artist || '') : 'از لیست پایین یک آهنگ انتخاب کنید';
}

function setPlayingUI(playing){
  isPlaying = playing;
  miniPlay.hidden = playing;
  miniPause.hidden = !playing;
  miniViz.classList.toggle('active', playing);
}

function playIndex(i){
  if (i < 0 || i >= playlist.length) return;
  currentIndex = i;
  audio.src = playlist[i].url;
  seekBar.value = 0;
  seekBar.max = 0;
  seekBar.disabled = true;
  curTimeEl.textContent = '۰:۰۰';
  durTimeEl.textContent = '۰:۰۰';
  paintSeekBar(0);
  updateMiniPlayer();
  highlightActiveRow();
  const playPromise = audio.play();
  if (playPromise){
    playPromise.then(() => setPlayingUI(true)).catch(() => setPlayingUI(false));
  } else {
    setPlayingUI(true);
  }
}

function nextIndex(){
  if (playlist.length === 0) return -1;
  if (shuffle){
    if (playlist.length === 1) return 0;
    let r;
    do { r = Math.floor(Math.random() * playlist.length); } while (r === currentIndex);
    return r;
  }
  return (currentIndex + 1) % playlist.length;
}

playPauseBtn.addEventListener('click', () => {
  if (currentIndex === -1){
    if (playlist.length) playIndex(0);
    return;
  }
  if (isPlaying){
    audio.pause();
    setPlayingUI(false);
  } else {
    const playPromise = audio.play();
    if (playPromise){
      playPromise.then(() => setPlayingUI(true)).catch(() => setPlayingUI(false));
    } else {
      setPlayingUI(true);
    }
  }
});

shuffleBtn.addEventListener('click', () => {
  shuffle = !shuffle;
  shuffleBtn.classList.toggle('on', shuffle);
});

audio.addEventListener('ended', () => {
  const n = nextIndex();
  if (n !== -1) playIndex(n);
});
audio.addEventListener('error', () => {
  miniArtist.textContent = "خطا در پخش این فایل";
});

async function init(){
  try{
    playlist = await fetchPlaylist();
    if (playlist.length === 0){
      stateMsg.textContent = "هنوز آهنگی در پوشه‌ی songs پیدا نشد.";
      return;
    }
    stateMsg.style.display = 'none';
    renderList();
  }catch(e){
    stateMsg.innerHTML = "خطا در دریافت لیست آهنگ‌ها. اتصال اینترنت یا تنظیمات مخزن را بررسی کنید.";
    const btn = document.createElement('button');
    btn.className = 'retry-btn';
    btn.textContent = 'تلاش دوباره';
    btn.addEventListener('click', () => {
      stateMsg.textContent = "در حال بارگذاری لیست آهنگ‌ها…";
      stateMsg.style.display = 'block';
      init();
    });
    stateMsg.appendChild(document.createElement('br'));
    stateMsg.appendChild(btn);
  }
}
init();

if (window.Telegram && window.Telegram.WebApp){
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
}
</script>
