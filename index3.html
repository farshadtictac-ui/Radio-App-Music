<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>رادیو آنلاین</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0c0f16;
    --bg-1:#151a24;
    --amber:#f2a65a;
    --amber-dim:#8a6636;
    --teal:#3bd6c6;
    --text:#eef1f6;
    --text-dim:#8b93a5;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;height:100%;
    background:radial-gradient(ellipse at 50% 0%, var(--bg-1), var(--bg-0) 70%);
    color:var(--text);
    font-family:'Space Grotesk',system-ui,sans-serif;
    overflow:hidden;
  }
  body{
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;min-height:100dvh;
    padding:24px;
  }
  #viz{
    position:fixed;inset:0;width:100%;height:100%;
    opacity:.35;pointer-events:none;
  }
  .radio-frame{
    position:relative;z-index:1;
    width:100%;max-width:360px;
    display:flex;flex-direction:column;align-items:center;
    gap:28px;
  }
  .brand{
    text-align:center;
  }
  .brand .eyebrow{
    font-family:'Space Mono',monospace;
    font-size:11px;letter-spacing:.3em;
    color:var(--amber);
    text-transform:uppercase;
  }
  .brand h1{
    margin:6px 0 0;
    font-size:22px;font-weight:700;
    letter-spacing:.02em;
  }
  .led-display{
    width:100%;
    background:linear-gradient(180deg,#10141d,#0a0d13);
    border:1px solid rgba(242,166,90,.18);
    border-radius:14px;
    padding:16px 18px;
    box-shadow:inset 0 0 24px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.02);
  }
  .led-row{
    display:flex;align-items:center;gap:8px;
    font-family:'Space Mono',monospace;
    font-size:10px;letter-spacing:.15em;
    color:var(--text-dim);
    margin-bottom:8px;
  }
  .dot{
    width:7px;height:7px;border-radius:50%;
    background:#3a4152;
    box-shadow:0 0 0 rgba(242,166,90,0);
    transition:all .3s;
  }
  .dot.live{
    background:var(--amber);
    box-shadow:0 0 8px var(--amber);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;}
    50%{opacity:.4;}
  }
  #trackTitle{
    font-family:'Space Mono',monospace;
    font-size:15px;
    color:var(--amber);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #trackArtist{
    margin-top:4px;
    font-size:13px;
    color:var(--text-dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .dial-wrap{
    position:relative;
    width:168px;height:168px;
    display:flex;align-items:center;justify-content:center;
  }
  .ticks{
    position:absolute;inset:0;
    border-radius:50%;
    transition:filter .4s;
  }
  .ticks::before{
    content:"";
    position:absolute;inset:0;
    border-radius:50%;
    background:
      repeating-conic-gradient(
        rgba(242,166,90,.55) 0deg 1.2deg,
        transparent 1.2deg 9deg
      );
    -webkit-mask:radial-gradient(farthest-side, transparent 76%, #000 78%, #000 100%);
    mask:radial-gradient(farthest-side, transparent 76%, #000 78%, #000 100%);
  }
  .ticks.spin::before{
    animation:spin 18s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #playBtn{
    position:relative;z-index:2;
    width:120px;height:120px;
    border-radius:50%;
    border:1px solid rgba(242,166,90,.35);
    background:radial-gradient(circle at 35% 30%, #1c2230, #0d1119 70%);
    box-shadow:0 8px 28px rgba(0,0,0,.55), inset 0 0 18px rgba(0,0,0,.6);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:box-shadow .3s, transform .15s;
  }
  #playBtn:active{ transform:scale(.96); }
  #playBtn.playing{
    box-shadow:0 8px 28px rgba(0,0,0,.55), 0 0 26px rgba(242,166,90,.35), inset 0 0 18px rgba(0,0,0,.6);
  }
  #playBtn svg{ width:38px;height:38px; }
  #playBtn svg path,
  #playBtn svg rect{ fill:var(--amber); }
  .hint{
    font-size:12px;
    color:var(--text-dim);
    text-align:center;
    min-height:16px;
  }
  @media (prefers-reduced-motion: reduce){
    .ticks.spin::before{ animation:none; }
    .dot.live{ animation:none; }
  }
</style>
</head>
<body>

<canvas id="viz"></canvas>

<div class="radio-frame">
  <div class="brand">
    <div class="eyebrow">پخش زنده ۲۴ ساعته</div>
    <h1>رادیو من</h1>
  </div>

  <div class="led-display">
    <div class="led-row">
      <span class="dot" id="liveDot"></span>
      <span id="statusText">آماده پخش</span>
    </div>
    <div id="trackTitle">در حال بارگذاری…</div>
    <div id="trackArtist"></div>
  </div>

  <div class="dial-wrap">
    <div class="ticks" id="ticks"></div>
    <button id="playBtn" aria-label="پخش">
      <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="iconPause" viewBox="0 0 24 24" hidden><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>
    </button>
  </div>

  <p class="hint">برای شروع، روی دکمه لمس کنید. برای توقف دوباره لمس کنید.</p>
</div>

<script>
/* =====================================================================
   لیست آهنگ‌ها — فقط همین بخش را برای اضافه/حذف/تغییر آهنگ ویرایش کنید.
   هر آهنگ باید یک عنوان، نام خواننده (اختیاری) و آدرس فایل mp3 داشته باشد.
   آدرس فایل نسبت به همین صفحه است، مثلا اگر فایل داخل پوشه songs باشد:
   "songs/song1.mp3"
   ===================================================================== */
const playlist = [
  { title: "آهنگ نمونه ۱", artist: "خواننده نمونه", url: "songs/track1.mp3" },
  { title: "آهنگ نمونه ۲", artist: "خواننده نمونه", url: "songs/track2.mp3" },
  { title: "آهنگ نمونه ۳", artist: "خواننده نمونه", url: "songs/track3.mp3" },
];
/* ===================================================================== */

let currentIndex = 0;
let isPlaying = false;
let audioCtx, analyser, sourceNode, dataArray;

// ===== موتور همگام‌سازی «رادیوی زنده واقعی» =====
// یک نقطه‌ی مرجعِ ثابت در زمان که برای همه‌ی کاربران، روی هر دستگاهی، یکسانه.
const RADIO_EPOCH = new Date('2024-01-01T00:00:00Z').getTime();
let trackDurations = [];   // مدت‌زمان (ثانیه) هر آهنگ، پس از اندازه‌گیری
let totalDuration = 0;     // مجموع مدت‌زمان کل پلی‌لیست
let durationsReady = false;
let resyncArmed = false;   // جلوگیری از فراخوانی چندباره‌ی رویداد loadedmetadata

const audio = new Audio();
audio.preload = "auto";

const playBtn = document.getElementById('playBtn');
const iconPlay = document.getElementById('iconPlay');
const iconPause = document.getElementById('iconPause');
const ticks = document.getElementById('ticks');
const liveDot = document.getElementById('liveDot');
const statusText = document.getElementById('statusText');
const trackTitle = document.getElementById('trackTitle');
const trackArtist = document.getElementById('trackArtist');

// مدت‌زمان یک فایل صوتی را بدون پخش کامل آن اندازه می‌گیرد
function measureDuration(url){
  return new Promise((resolve) => {
    const probe = new Audio();
    probe.preload = 'metadata';
    probe.src = url;
    probe.addEventListener('loadedmetadata', () => {
      resolve(isFinite(probe.duration) && probe.duration > 0 ? probe.duration : 180);
    });
    probe.addEventListener('error', () => resolve(180)); // مقدار پیش‌فرض در صورت خطا
  });
}

async function prepareSchedule(){
  if (durationsReady) return;
  statusText.textContent = "در حال آماده‌سازی پخش زنده…";
  trackDurations = await Promise.all(playlist.map(t => measureDuration(t.url)));
  totalDuration = trackDurations.reduce((a, b) => a + b, 0);
  durationsReady = totalDuration > 0;
}

// بر اساس ساعت واقعی، مشخص می‌کند الان دقیقاً کدام آهنگ و کدام ثانیه از آن باید پخش شود
function getLivePosition(){
  const elapsed = (Date.now() - RADIO_EPOCH) / 1000;
  let pos = elapsed % totalDuration;
  let acc = 0;
  for (let i = 0; i < trackDurations.length; i++){
    if (pos < acc + trackDurations[i]){
      return { index: i, offset: pos - acc };
    }
    acc += trackDurations[i];
  }
  return { index: 0, offset: 0 };
}

// آهنگ فعلیِ زنده را بارگذاری و از همان لحظه‌ی درست پخش می‌کند
function tuneToLive(){
  const { index, offset } = getLivePosition();
  currentIndex = index;
  const t = playlist[currentIndex];
  trackTitle.textContent = t.title || "بدون عنوان";
  trackArtist.textContent = t.artist || "";
  audio.src = t.url;

  const onReady = () => {
    audio.currentTime = Math.min(offset, Math.max(audio.duration - 0.5, 0));
    audio.play().catch(() => {});
    audio.removeEventListener('loadedmetadata', onReady);
  };
  audio.addEventListener('loadedmetadata', onReady);
}

// وقتی یک آهنگ تمام می‌شود، دوباره بر اساس ساعت واقعی تنظیم می‌شود
// (این کار هم‌زمان «رفتن به آهنگ بعدی» و «تصحیح هرگونه انحراف زمانی» را انجام می‌دهد)
audio.addEventListener('ended', () => { if (isPlaying) tuneToLive(); });
audio.addEventListener('error', () => {
  statusText.textContent = "خطا در بارگذاری، تلاش دوباره…";
  setTimeout(() => { if (isPlaying) tuneToLive(); }, 1200);
});

function setPlayingUI(playing){
  isPlaying = playing;
  iconPlay.hidden = playing;
  iconPause.hidden = !playing;
  playBtn.classList.toggle('playing', playing);
  ticks.classList.toggle('spin', playing);
  liveDot.classList.toggle('live', playing);
  statusText.textContent = playing ? "در حال پخش زنده" : "متوقف شد";
}

function ensureAudioGraph(){
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  sourceNode = audioCtx.createMediaElementSource(audio);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 64;
  sourceNode.connect(analyser);
  analyser.connect(audioCtx.destination);
  dataArray = new Uint8Array(analyser.frequencyBinCount);
  drawViz();
}

playBtn.addEventListener('click', async () => {
  if (!isPlaying){
    ensureAudioGraph();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    try{
      await prepareSchedule();
      if (!durationsReady){
        statusText.textContent = "خطا در بارگذاری فایل‌ها";
        return;
      }
      isPlaying = true;      // پیش از تیون‌کردن true می‌شود تا 'ended' زنجیره را ادامه دهد
      tuneToLive();
      setPlayingUI(true);
    }catch(e){
      isPlaying = false;
      statusText.textContent = "پخش با خطا مواجه شد";
    }
  } else {
    audio.pause();
    setPlayingUI(false);
  }
});

/* ---- بصری‌ساز سبک بر پایه فرکانس صدا ---- */
const canvas = document.getElementById('viz');
const ctx = canvas.getContext('2d');
function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

function drawViz(){
  requestAnimationFrame(drawViz);
  if (!analyser) return;
  analyser.getByteFrequencyData(dataArray);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const barCount = dataArray.length;
  const gap = 4;
  const barWidth = canvas.width / barCount - gap;
  let x = 0;
  for (let i=0;i<barCount;i++){
    const v = dataArray[i] / 255;
    const h = v * canvas.height * 0.5;
    const grad = ctx.createLinearGradient(0, canvas.height, 0, canvas.height - h);
    grad.addColorStop(0, 'rgba(242,166,90,0.55)');
    grad.addColorStop(1, 'rgba(59,214,198,0.05)');
    ctx.fillStyle = grad;
    ctx.fillRect(x, canvas.height - h, barWidth, h);
    x += barWidth + gap;
  }
}

loadTrack(0);

/* ---- یکپارچه‌سازی با تلگرام ---- */
if (window.Telegram && window.Telegram.WebApp){
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
  document.documentElement.style.background = 'transparent';
}
</script>
</body>
</html>
